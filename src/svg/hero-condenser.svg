<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1A16"/>
      <stop offset="0.55" stop-color="#161310"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2822"/>
      <stop offset="1" stop-color="#1D1915"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#191512"/>
      <stop offset="1" stop-color="#262019"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5FD1" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#0B5FD1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FB2FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- schematic ground grid -->
  <g stroke="#241F1A" stroke-width="1">
    <path d="M0 700H1600M0 760H1600M0 820H1600"/>
    <path d="M120 900L360 700M420 900L560 700M720 900L760 700M1020 900L960 700M1320 900L1160 700"/>
  </g>

  <!-- distant house, left -->
  <g fill="none" stroke="#3A322A" stroke-width="2.5" stroke-linejoin="round">
    <path d="M60 700V540L180 452L300 540V700"/>
    <path d="M60 700h240"/>
    <path d="M132 700v-72h44v72"/>
    <path d="M212 700v-56h50v56"/>
  </g>

  <!-- refrigerant line from house to unit -->
  <g fill="none" stroke="#4A4038" stroke-width="7" stroke-linecap="round">
    <path d="M300 610C470 610 560 556 700 556"/>
  </g>
  <g fill="none" stroke="#0B5FD1" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M300 604C470 604 560 550 700 550"/>
  </g>
  <g fill="none" stroke="#D6401F" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M300 616C470 616 560 562 700 562"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="1215" cy="712" rx="290" ry="26" fill="#0B0908" opacity="0.65"/>

  <!-- condenser cabinet -->
  <g>
    <!-- right side panel -->
    <path d="M1420 236L1508 176V648L1420 700Z" fill="url(#side)" stroke="#4A4038" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- front face -->
    <rect x="940" y="236" width="480" height="464" rx="10" fill="url(#cab)" stroke="#5A4F44" stroke-width="3"/>
    <!-- top cap -->
    <path d="M940 236L1028 176H1508L1420 236Z" fill="#332C25" stroke="#5A4F44" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- louvered vent band across the top of the face -->
    <g stroke="#0F0D0B" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <path d="M968 268H1392M968 288H1392M968 308H1392"/>
    </g>
    <g stroke="#4A4038" stroke-width="1.5">
      <path d="M968 268H1392M968 288H1392M968 308H1392"/>
    </g>

    <!-- fan grille -->
    <circle cx="1180" cy="466" r="152" fill="#100E0C" stroke="#5A4F44" stroke-width="3"/>
    <g stroke="#3A322A" stroke-width="1.5" fill="none">
      <circle cx="1180" cy="466" r="140"/>
      <circle cx="1180" cy="466" r="122"/>
      <circle cx="1180" cy="466" r="104"/>
      <circle cx="1180" cy="466" r="86"/>
      <circle cx="1180" cy="466" r="68"/>
      <circle cx="1180" cy="466" r="50"/>
      <circle cx="1180" cy="466" r="32"/>
      <circle cx="1180" cy="466" r="16"/>
    </g>
    <!-- blades -->
    <g fill="#1C1814" stroke="#4E443A" stroke-width="2">
      <g transform="translate(1180 466)">
        <path d="M0 -14C40 -34 74 -22 88 4C58 2 26 6 0 14Z" transform="rotate(0)"/>
        <path d="M0 -14C40 -34 74 -22 88 4C58 2 26 6 0 14Z" transform="rotate(60)"/>
        <path d="M0 -14C40 -34 74 -22 88 4C58 2 26 6 0 14Z" transform="rotate(120)"/>
        <path d="M0 -14C40 -34 74 -22 88 4C58 2 26 6 0 14Z" transform="rotate(180)"/>
        <path d="M0 -14C40 -34 74 -22 88 4C58 2 26 6 0 14Z" transform="rotate(240)"/>
        <path d="M0 -14C40 -34 74 -22 88 4C58 2 26 6 0 14Z" transform="rotate(300)"/>
      </g>
    </g>
    <circle cx="1180" cy="466" r="14" fill="#3A322A" stroke="#5A4F44" stroke-width="2"/>

    <!-- refrigerant service valves -->
    <g fill="#0F0D0B" stroke="#4E443A" stroke-width="2">
      <circle cx="1000" cy="656" r="15"/>
      <circle cx="1000" cy="656" r="7" fill="#3A322A"/>
    </g>
    <text x="1032" y="662" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#8A8076" letter-spacing="2">LINE SET</text>
  </g>

  <!-- cold air pulled in from the left, across the coil -->
  <g>
    <path d="M742 330C830 322 900 330 962 348" fill="none" stroke="url(#cold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M742 400C836 392 906 404 962 424" fill="none" stroke="url(#cold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M742 470C836 464 906 476 962 496" fill="none" stroke="url(#cold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M742 540C836 534 906 546 962 566" fill="none" stroke="url(#cold)" stroke-width="7" stroke-linecap="round"/>
    <g fill="none" stroke="#7FB2FF" stroke-width="2" opacity="0.55" stroke-linecap="round">
      <path d="M760 316l-34 -20M760 386l-34 -20M760 456l-34 -20M760 526l-34 -20"/>
    </g>
  </g>

  <!-- heat rejected upward and to the right -->
  <g fill="none" stroke="#D6401F" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M1040 224C1044 168 1064 128 1104 96"/>
    <path d="M1140 224C1144 162 1168 118 1214 84"/>
    <path d="M1240 224C1244 168 1266 128 1306 96"/>
    <path d="M1340 224C1344 176 1362 140 1396 112"/>
  </g>
  <g fill="none" stroke="#F08A63" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M1064 226C1068 178 1086 142 1120 114"/>
    <path d="M1264 226C1268 178 1288 142 1322 114"/>
  </g>

  <!-- subtle vignette -->
  <rect width="1600" height="900" fill="none" stroke="#0B0908" stroke-width="120" opacity="0.35"/>
</svg>
