<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img">
  <rect width="900" height="900" fill="#F0EBE3"/>

  <!-- wall plate -->
  <rect x="250" y="150" width="400" height="600" rx="26" fill="#FFFFFF" stroke="#141210" stroke-width="4"/>
  <rect x="290" y="196" width="320" height="150" rx="12" fill="#0B0908" stroke="#4A443D" stroke-width="3"/>

  <!-- display -->
  <text x="450" y="286" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="76" fill="#7FB2FF" letter-spacing="2">78</text>
  <text x="450" y="322" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#5C7FB0" letter-spacing="4">SET 72 &#183; INDOOR</text>

  <!-- mode indicators -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" letter-spacing="2" text-anchor="middle">
    <circle cx="330" cy="410" r="9" fill="#0B5FD1"/>
    <text x="330" y="440" fill="#141210">COOL</text>
    <circle cx="450" cy="410" r="9" fill="#DED7CE"/>
    <text x="450" y="440" fill="#9A9088">FAN</text>
    <circle cx="570" cy="410" r="9" fill="#DED7CE"/>
    <text x="570" y="440" fill="#9A9088">HEAT</text>
  </g>

  <!-- fan speed bar -->
  <g>
    <rect x="300" y="490" width="300" height="14" rx="7" fill="#E4DED4"/>
    <rect x="300" y="490" width="204" height="14" rx="7" fill="#0B5FD1"/>
    <g fill="#4A443D">
      <circle cx="300" cy="497" r="9"/>
      <circle cx="375" cy="497" r="9"/>
      <circle cx="450" cy="497" r="9"/>
      <circle cx="525" cy="497" r="9"/>
      <circle cx="600" cy="497" r="9"/>
    </g>
    <text x="450" y="545" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#9A9088" letter-spacing="3">AUTO</text>
  </g>

  <!-- humidity, the number that matters in Houston -->
  <g>
    <rect x="300" y="580" width="300" height="60" rx="8" fill="#F0EBE3" stroke="#DED7CE" stroke-width="2"/>
    <text x="330" y="620" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" fill="#141210" letter-spacing="2">62%</text>
    <text x="420" y="618" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#6E655B" letter-spacing="2">HUMIDITY</text>
  </g>

  <!-- set point dial -->
  <g>
    <circle cx="450" cy="700" r="52" fill="#FFFFFF" stroke="#141210" stroke-width="4"/>
    <circle cx="450" cy="700" r="36" fill="#E4DED4"/>
    <path d="M450 700L450 664" stroke="#141210" stroke-width="6" stroke-linecap="round"/>
    <circle cx="450" cy="700" r="7" fill="#0B5FD1"/>
  </g>

  <!-- callout to the humidity reading -->
  <g fill="none" stroke="#B0321A" stroke-width="3">
    <path d="M600 600C660 600 660 560 640 530"/>
  </g>
  <text x="616" y="516" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#B0321A" letter-spacing="2">THE NUMBER</text>
  <text x="616" y="540" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#B0321A" letter-spacing="2">THAT MATTERS</text>
</svg>
