<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img">
  <rect width="1200" height="820" fill="#F0EBE3"/>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="21" fill="#6E655B" letter-spacing="3">
    <text x="56" y="60">SPLIT SYSTEM, HOW IT MOVES AIR</text>
  </g>

  <!-- house shell -->
  <g fill="none" stroke="#4A443D" stroke-width="3" stroke-linejoin="round">
    <path d="M120 660V300L600 120L1080 300V660Z"/>
  </g>
  <g fill="#E4DED4" stroke="#4A443D" stroke-width="3" stroke-linejoin="round">
    <path d="M120 660V300L600 120L1080 300V660Z" opacity="0"/>
  </g>

  <!-- indoor evaporator, upper right interior -->
  <g>
    <rect x="770" y="360" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#141210" stroke-width="3"/>
    <g stroke="#0B5FD1" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M800 396H990M800 416H990M800 436H990M800 456H990M800 476H990"/>
    </g>
    <g stroke="#4A443D" stroke-width="2">
      <path d="M800 396H990M800 416H990M800 436H990M800 456H990M800 476H990"/>
    </g>
    <text x="895" y="340" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#141210" letter-spacing="2">EVAPORATOR</text>
  </g>

  <!-- supply air from vents -->
  <g fill="#0B5FD1" opacity="0.16">
    <path d="M300 690C300 620 340 570 420 560L700 530C780 522 800 470 800 400V380H790V400C790 470 760 512 700 518L420 548C330 558 288 615 288 690Z"/>
  </g>
  <g fill="none" stroke="#0B5FD1" stroke-width="3" opacity="0.8" stroke-linecap="round">
    <path d="M300 686C300 620 340 572 420 562L700 532C782 524 800 470 800 402"/>
  </g>
  <g fill="#0B5FD1">
    <path d="M258 684l16 22 16-22z"/>
  </g>
  <text x="500" y="760" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#0A4CA8" letter-spacing="2">COLD AIR INTO THE ROOMS</text>

  <!-- return air -->
  <g fill="none" stroke="#6E655B" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round">
    <path d="M420 380C500 340 620 336 700 350"/>
  </g>
  <text x="520" y="330" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6E655B" letter-spacing="2">WARM RETURN AIR</text>

  <!-- outdoor condenser, lower right, outside the shell -->
  <g>
    <rect x="880" y="600" width="250" height="180" rx="8" fill="#FFFFFF" stroke="#141210" stroke-width="3"/>
    <circle cx="1005" cy="690" r="58" fill="none" stroke="#141210" stroke-width="3"/>
    <circle cx="1005" cy="690" r="44" fill="none" stroke="#141210" stroke-width="2"/>
    <circle cx="1005" cy="690" r="30" fill="none" stroke="#141210" stroke-width="2"/>
    <g stroke="#141210" stroke-width="2" fill="#F0EBE3">
      <path d="M1005 690c26-16 48-8 56 14-20 0-40 2-56 8z" transform="rotate(0 1005 690)"/>
      <path d="M1005 690c26-16 48-8 56 14-20 0-40 2-56 8z" transform="rotate(120 1005 690)"/>
      <path d="M1005 690c26-16 48-8 56 14-20 0-40 2-56 8z" transform="rotate(240 1005 690)"/>
    </g>
    <text x="1005" y="580" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#141210" letter-spacing="2">CONDENSER</text>
  </g>

  <!-- heat rejected -->
  <g fill="none" stroke="#D6401F" stroke-width="5" stroke-linecap="round">
    <path d="M960 596C960 548 980 516 1012 494"/>
    <path d="M1050 596C1050 544 1074 508 1110 486"/>
  </g>
  <g fill="none" stroke="#F08A63" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M1005 596C1005 556 1022 528 1048 508"/>
  </g>
  <text x="1060" y="470" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#B0321A" letter-spacing="2">HEAT OUT</text>

  <!-- refrigerant line set -->
  <g fill="none" stroke-linecap="round">
    <path d="M880 640C860 620 860 560 860 500C860 470 880 460 895 470" stroke="#4A443D" stroke-width="8"/>
    <path d="M880 634C864 616 864 562 864 502C864 476 880 468 893 476" stroke="#0B5FD1" stroke-width="3"/>
    <path d="M880 646C856 628 856 566 856 498C856 464 880 452 897 464" stroke="#D6401F" stroke-width="3"/>
  </g>
  <text x="712" y="596" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#6E655B" letter-spacing="2">LINE SET</text>

  <!-- airflow label at the top -->
  <g fill="#0B5FD1" opacity="0.9">
    <path d="M760 200l-20-30h40z"/>
  </g>
  <text x="760" y="160" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#0A4CA8" letter-spacing="2">REFRIGERANT CYCLE</text>
</svg>
